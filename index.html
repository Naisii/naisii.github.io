<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>奈思云 · 最新入口</title>
  <link rel="icon" href="./logo.png" />
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --ink: #111111;
      --ink-2: #333333;
      --ink-3: #6b7280;
      --ink-4: #9ca3af;
      --line: #e5e7eb;
      --fill: #f3f2ef;
      --red: #d92626;
      --red-soft: #fef2f2;
      --shadow: 4px 4px 0 #111111;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg);
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(217, 38, 38, 0.06), transparent 55%),
        linear-gradient(180deg, #faf9f7 0%, var(--bg) 40%, #f0efe9 100%);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 32px;
    }

    .main {
      width: min(520px, 100%);
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      animation: rise 0.55s ease both;
    }

    .logo-mark {
      width: 72px;
      height: 72px;
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      background: #000;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .logo-mark:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--ink);
    }

    .logo-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink);
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: rise 0.55s ease 0.08s both;
    }

    .intro {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink-2);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .intro strong {
      color: var(--ink);
      font-weight: 700;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item a {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      grid-template-areas:
        "label note arrow"
        "host  host arrow";
      column-gap: 10px;
      row-gap: 4px;
      align-items: center;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--fill);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .item a:hover {
      background: var(--red-soft);
      border-color: var(--red);
      transform: translateX(2px);
    }

    .item a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .label {
      grid-area: label;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
    }

    .host {
      grid-area: host;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .item a:hover .host { color: var(--red); }

    .note {
      grid-area: note;
      font-size: 12px;
      color: var(--ink-3);
      white-space: nowrap;
      justify-self: end;
    }

    .note.warn {
      color: var(--red);
      font-weight: 600;
    }

    .arrow {
      grid-area: arrow;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--ink-4);
      border-bottom: 2px solid var(--ink-4);
      transform: rotate(-45deg);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .item a:hover .arrow {
      border-color: var(--red);
      transform: rotate(-45deg) translate(1px, 1px);
    }

    .tip {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
      color: var(--ink-3);
      text-align: center;
    }

    footer {
      margin-top: 40px;
      padding: 16px 0 8px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-4);
      animation: rise 0.55s ease 0.16s both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .page { padding: 32px 16px 24px; }
      .main { gap: 24px; }
      h1 { font-size: 24px; }
      .card { padding: 16px; }
      .logo-mark { width: 64px; height: 64px; }
      .item a {
        grid-template-columns: minmax(0, 1fr) auto;
      }
      .note { white-space: normal; text-align: right; }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand, .card, footer { animation: none; }
      .logo-mark, .item a, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="main">
      <header class="brand">
        <a class="logo-mark" href="https://naisisi.com" target="_blank" rel="noopener noreferrer" aria-label="奈思云">
          <img src="https://naisisi.com/assets/brand-logo.png" alt="奈思云 NS" width="72" height="72" />
        </a>
        <div class="brand-name">Naisisi.com</div>
        <h1>欢迎体验奈思云</h1>
      </header>

      <section class="card" aria-labelledby="portal-title">
        <p class="intro" id="portal-title">
          <strong>由于防火墙动态封锁，如遇到官网无法访问，请收藏以下最新入口：</strong>
        </p>

        <ul class="list">
          <li class="item">
            <a href="https://naisii.com" target="_blank" rel="noopener noreferrer">
              <span class="label">官方主站</span>
              <span class="note warn">需要翻墙</span>
              <span class="host">naisii.com</span>
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li class="item">
            <a href="https://naisisi.com" target="_blank" rel="noopener noreferrer">
              <span class="label">备用地址一</span>
              <span class="note">推荐收藏</span>
              <span class="host">naisisi.com</span>
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li class="item">
            <a href="https://2nsi.com" target="_blank" rel="noopener noreferrer">
              <span class="label">备用地址二</span>
              <span class="host">2nsi.com</span>
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li class="item">
            <a href="https://2nnss.com" target="_blank" rel="noopener noreferrer">
              <span class="label">备用地址三</span>
              <span class="host">2nnss.com</span>
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </li>
          <li class="item">
            <a href="https://ninilinini.com" target="_blank" rel="noopener noreferrer">
              <span class="label">线路页</span>
              <span class="note">妮妮理妮妮点看</span>
              <span class="host">ninilinini.com</span>
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </li>
        </ul>

        <p class="tip">建议同时收藏 2–3 个入口，避免单点失效。</p>
      </section>
    </main>

    <footer>
      © 奈思云品牌归属 NAISI.LAB LLC 公司所有
    </footer>
  </div>
</body>
</html>
